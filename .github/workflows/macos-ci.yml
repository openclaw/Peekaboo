name: macOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peekaboo-core:
    name: PeekabooCore build & tests
    runs-on: macos-26
    env:
      PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
      RUN_AUTOMATION_TESTS: "false"
      RUN_LOCAL_TESTS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.9.0"

      - name: Configure checkout-local Swift workspace
        run: python3 scripts/setup-swift-workspace.py setup

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Verify Chrome provider contract
        run: |
          pnpm install --frozen-lockfile
          node --no-warnings scripts/test-chrome-devtools-mcp-contract.mjs
          node --no-warnings scripts/test-browser-provider-connection.mjs

      - name: Docs lint
        run: |
          node scripts/docs-lint.mjs
          node --test tests/docs-site-toc.test.mjs
          pnpm run test:guidance
          node --test tests/ambient-state-test-policy.test.mjs

      - name: Verify Homebrew release handoff
        run: node --test tests/homebrew-release-assets.test.mjs

      - name: Select Xcode 26.6 (if present) or fallback to default
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          /usr/bin/xcodebuild -version

      - name: Compute SwiftPM cache key (PeekabooCore)
        id: cache-key-core
        env:
          CACHE_PREFIX: ${{ runner.os }}-spm-core-
        run: |
          set -euo pipefail
          if [ -f Core/PeekabooCore/Package.resolved ]; then
            HASH=$(shasum Core/PeekabooCore/Package.resolved | awk '{print $1}')
          else
            echo "Package.resolved missing, falling back to commit SHA"
            HASH=${GITHUB_SHA}
          fi
          echo "key=${CACHE_PREFIX}${HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM (PeekabooCore)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.swiftpm
            ~/.cache/org.swift.swiftpm
            Core/PeekabooCore/.build
          key: ${{ steps.cache-key-core.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-spm-core-

      - name: Clean SwiftPM trait state (PeekabooCore)
        run: |
          set -euo pipefail
          # SwiftPM caches evaluated manifests in an sqlite DB. We've seen this get stale across
          # `swift-configuration` trait renames (e.g. `JSONSupport` -> `JSON`) and break resolution.
          for root in "$HOME/Library/Caches/org.swift.swiftpm" "$HOME/.cache/org.swift.swiftpm"; do
            if [ -d "$root" ]; then
              find "$root" -type f -name "manifest.db*" -print -delete || true
              find "$root" -type f -name "manifests.db*" -print -delete || true
              find "$root" -type f -name "package-collection.db*" -print -delete || true
            fi
          done
          # SwiftPM traits can be persisted into `.swiftpm/configuration/traits.json` (and can get stuck in caches).
          # When upstream packages rename/remove traits, stale state can break builds.
          find ~/.swiftpm -type f -name traits.json -print -delete || true
          if [ -d ~/.cache/org.swift.swiftpm ]; then
            find ~/.cache/org.swift.swiftpm -type d -name .swiftpm -prune -print -exec rm -rf {} + || true
          fi
          if [ -d Core/PeekabooCore/.swiftpm ]; then
            find Core/PeekabooCore/.swiftpm -type f -name traits.json -print -delete || true
          fi
          if [ -d Core/PeekabooCore/.build/checkouts ]; then
            find Core/PeekabooCore/.build/checkouts -type d -name .swiftpm -prune -print -exec rm -rf {} + || true
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift toolchain version
        run: swift --version

      - name: Run foreground hotkey release contracts
        working-directory: Core/PeekabooAutomationKit
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
          PEEKABOO_RUN_INPUT_AUTOMATION_TESTS: "false"
          RUN_AUTOMATION_READ: "false"
          RUN_AUTOMATION_TESTS: "false"
          RUN_AUTOMATION_ACTIONS: "false"
          RUN_LOCAL_TESTS: "false"
          PEEKABOO_CONFIG_DISABLE_MIGRATION: "1"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/foreground-hotkey-release.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel --jobs 4 \
            --filter '^PeekabooAutomationKitTests[.](HotkeyServiceForegroundReleaseTests|ForegroundKeyboardEventPairTests)/' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite HotkeyServiceForegroundReleaseTests passed after ' "$test_log"
          grep -Fq 'Suite ForegroundKeyboardEventPairTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run clipboard paste admission gate contracts
        working-directory: Core/PeekabooAutomationKit
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/clipboard-paste-admission-gate.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel \
            --filter '^PeekabooAutomationKitTests\.ClipboardPasteTransactionGateTests/' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite ClipboardPasteTransactionGateTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run mutation inventory, selector, and host window contracts
        working-directory: Core/PeekabooAutomationKit
        env:
          RUN_AUTOMATION_ACTIONS: "true"
        run: |
          set -o pipefail
          test_log="$RUNNER_TEMP/host-window-contracts.log"
          swift test --no-parallel \
            --filter 'SystemIdentityResolverTests|ApplicationInventoryTimeoutTests|ApplicationInventoryAbsenceTests|ApplicationMutationPlannerTests|ApplicationMutationSelectorTests|ApplicationIdentifierMatcherTests|ObservationExactWindowResolverTests|SameProcessWindowCloseTests' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite SameProcessWindowCloseTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run application running-state contracts
        working-directory: Core/PeekabooAutomationKit
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/application-running-state.log"
          swift test --no-parallel --filter ApplicationRunningStateTests 2>&1 | tee "$test_log"
          grep -Fq 'Suite ApplicationRunningStateTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run focus observation and accounting contracts
        working-directory: Core/PeekabooAutomationKit
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
          PEEKABOO_RUN_INPUT_AUTOMATION_TESTS: "false"
          RUN_AUTOMATION_ACTIONS: "false"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/focus-contracts.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel \
            --filter '^PeekabooAutomationKitTests[.](FocusDispatchAccountingTests|FocusRaiseDispatchAccountingTests|FocusedElementReceiptResolverTests|ObservedFocusCorroborationTests)/' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite FocusDispatchAccountingTests passed after ' "$test_log"
          grep -Fq 'Suite FocusRaiseDispatchAccountingTests passed after ' "$test_log"
          grep -Fq 'Suite FocusedElementReceiptResolverTests passed after ' "$test_log"
          grep -Fq 'Suite ObservedFocusCorroborationTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run desktop operation lane lock contracts
        working-directory: Core/PeekabooAutomationKit
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/desktop-operation-lane-lock-contracts.log"
          swift test --no-parallel --filter 'DesktopOperationLaneCoordinatorTests' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite DesktopOperationLaneCoordinatorTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run SDK and background text route regressions
        working-directory: Core/PeekabooAutomationKit
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/text-route-eligibility.log"
          filter='^PeekabooAutomationKitTests[.](TextInputRouteTests|TypeServiceForegroundPolicyTests|UIInputPolicyDefaultTests|BackgroundTextInputDeliveryTests|BackgroundTextRouteRefusalTests|BackgroundTextInputReceiverTests)/'
          filter+='|^PeekabooAutomationKitTests[.]TypeServiceTargetResolutionTests/`(targeted printable characters preserve their exact Unicode payload|literal Unicode events discard inherited modifiers without changing text or destination)`\('
          swift test --disable-xctest --enable-swift-testing --no-parallel \
            --filter "$filter" \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite TextInputRouteTests passed after ' "$test_log"
          grep -Fq 'Suite TypeServiceForegroundPolicyTests passed after ' "$test_log"
          grep -Fq 'Suite UIInputPolicyDefaultTests passed after ' "$test_log"
          grep -Fq 'Suite BackgroundTextInputDeliveryTests passed after ' "$test_log"
          grep -Fq 'Suite BackgroundTextRouteRefusalTests passed after ' "$test_log"
          grep -Fq 'Suite BackgroundTextInputReceiverTests passed after ' "$test_log"
          grep -Fq 'Suite TypeServiceTargetResolutionTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Build PeekabooCore
        working-directory: Core/PeekabooCore
        run: |
          swift build --configuration debug

      - name: Run MCP wire and background policy tests
        working-directory: Core/PeekabooCore
        run: |
          swift test --no-parallel --filter 'PeekabooMCPServerTests|PeekabooMCPInitializationTests'
          swift test --no-parallel --filter 'MCPToolArgumentValidationTests|MCPToolExecutionPolicyTests|MCPPolicyAwareCatalogTests|MCPBackgroundPolicyExecutionTests'

      - name: Run MCP action fixtures and outcome contract tests
        working-directory: Core/PeekabooCore
        run: |
          swift test --no-parallel --filter 'MCPToolExecutionTests|MCPToolErrorHandlingTests|MCPElementActionToolExecutionTests|MCPSeeExactWindowTests|ClickToolQueryWaitTests|InspectUIToolExecutionTests'
          swift test --no-parallel --filter 'MCPDesktopActionOutcomeProjectionTests|MCPCompositeActionOutcomeTests'

      - name: Run exact hotkey receipt regressions
        working-directory: Core/PeekabooCore
        run: |
          set -o pipefail
          test_log="$RUNNER_TEMP/hotkey-receipt-contracts.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel \
            --filter '^PeekabooTests[.](HotkeySelectAllReceiptTests|MCPExactWindowKeyboardToolTests|TypeServiceAXFailureReceiptTests|TypingFinalReceiverBindingTests|MCPTypeTargetMetadataTests)/' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite HotkeySelectAllReceiptTests passed after ' "$test_log"
          grep -Fq 'Suite MCPExactWindowKeyboardToolTests passed after ' "$test_log"
          grep -Fq 'Suite TypeServiceAXFailureReceiptTests passed after ' "$test_log"
          grep -Fq 'Suite TypingFinalReceiverBindingTests passed after ' "$test_log"
          grep -Fq 'Suite MCPTypeTargetMetadataTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run MCP paste admission timeout regressions
        working-directory: Core/PeekabooCore
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/mcp-paste-admission-timeout.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel \
            --filter '^PeekabooTests\.PasteToolTransactionGateTests/`(paste admission timeout preserves observations and releases the MCP reservation|admitted paste retains prior focus when its input lane times out)`\(explicitPayload:\)(/|$)' \
            2>&1 | tee "$test_log"
          grep -Eq 'Test "paste admission timeout preserves observations and releases the MCP reservation"( with 2 test cases)? passed after ' "$test_log"
          grep -Eq 'Test "admitted paste retains prior focus when its input lane times out"( with 2 test cases)? passed after ' "$test_log"
          grep -Fq 'Suite PasteToolTransactionGateTests passed after ' "$test_log"
          grep -Eq 'Test run with 2 tests( in 1 suite)? passed after ' "$test_log"

      - name: Run Bridge negotiation and cancellation contracts
        working-directory: Core/PeekabooCore
        run: |
          swift test --no-parallel --filter 'PeekabooBridgeClientHostTrustTests|CaptureDiagnosticWireCompatibilityTests|PeekabooBridgeCancellationTests'

      - name: Run typed set-value verification contracts
        working-directory: Core/PeekabooCore
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
          PEEKABOO_RUN_INPUT_AUTOMATION_TESTS: "false"
          RUN_AUTOMATION_ACTIONS: "false"
        run: |
          set -euo pipefail
          native_log="$RUNNER_TEMP/native-set-value-verification.log"
          swift test --package-path ../PeekabooAutomationKit --disable-xctest --enable-swift-testing --no-parallel --jobs 2 \
            --filter '^PeekabooAutomationKitTests[.]SetValueVerificationTests/' \
            2>&1 | tee "$native_log"
          grep -Fq 'Suite SetValueVerificationTests passed after ' "$native_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$native_log"
          bridge_log="$RUNNER_TEMP/bridge-set-value-verification.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel --jobs 2 \
            --filter '^PeekabooBridgeTests[.](PeekabooBridgeSetValueVerificationTests|PeekabooBridgeSetValueVerificationWireTests)/|^PeekabooTests[.]PeekabooBridgeSetValueHostClientTests/' \
            2>&1 | tee "$bridge_log"
          grep -Fq 'Suite PeekabooBridgeSetValueVerificationTests passed after ' "$bridge_log"
          grep -Fq 'Suite PeekabooBridgeSetValueVerificationWireTests passed after ' "$bridge_log"
          grep -Fq 'Suite PeekabooBridgeSetValueHostClientTests passed after ' "$bridge_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$bridge_log"

      - name: Run Bridge application running-state contracts
        working-directory: Core/PeekabooCore
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/bridge-application-running-state.log"
          swift test --no-parallel --filter PeekabooBridgeApplicationRunningStateTests 2>&1 | tee "$test_log"
          grep -Fq 'Suite PeekabooBridgeApplicationRunningStateTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run browser capability and guidance contracts
        working-directory: Core/PeekabooCore
        run: |
          swift test --no-parallel \
            --filter 'BrowserToolTests|BrowserToolCapabilityIntegrationTests|RemoteBrowserMCPSessionTests|PeekabooServicesBrowserSessionProviderTests|AgentSystemPromptTests'
          swift test --no-parallel \
            --filter 'BrowserMCPApprovalTransportTests|BrowserMCPConfigTests|BrowserMCPProviderConnectionTests|BrowserMCPSingleConnectionTests|BrowserMCPChannelEndpointResolverTests|BrowserMCPSessionManagerChannelRefusalTests|PeekabooBridgeBrowserRootEpochTests'
          swift test --package-path ../PeekabooFoundation --no-parallel --filter BrowserLoopbackEndpointTests

      - name: Run focused Swift tests
        working-directory: Core/PeekabooCore
        run: |
          swift test --no-parallel --filter 'PeekabooAIServiceImageFileSizeTests|PeekabooAIServiceImageMIMETests|MCPAnalyzeImageFileTests'
          swift test --no-parallel --filter CredentialFileTests
          swift test --no-parallel --filter ConfigurationManagerConcurrencyTests
          swift test --no-parallel --filter ConfigurationAccessorsOAuthTests
          swift test --no-parallel --filter ScreenCaptureServiceFlowTests
          swift test --no-parallel --filter 'AgentRuntimeBoundaryRegressionTests|AgentDesktopContextPolicyTests'
          swift test --no-parallel --filter AgentSessionManagerStorageTests
          swift test --no-parallel --filter PeekabooAgentServiceTests
          swift test --no-parallel --filter PeekabooAgentSessionSafetyTests
          swift test --no-parallel --filter PeekabooAgentStreamTerminalIntegrityTests

      - name: Run Agent partial-failure diagnostics contracts
        working-directory: Core/PeekabooCore
        env:
          PEEKABOO_CONFIG_DISABLE_MIGRATION: "1"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/agent-partial-failure-diagnostics.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel \
            --filter 'PeekabooAgentStepLimitTests|AgentExecutionTraceTests|SnapshotInvalidationMetadataTests' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite PeekabooAgentStepLimitTests passed after ' "$test_log"
          grep -Fq 'Suite AgentExecutionTraceTests passed after ' "$test_log"
          grep -Fq 'Suite SnapshotInvalidationMetadataTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run targeted dialog metadata and deadline contracts
        working-directory: Core/PeekabooAutomationKit
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
          PEEKABOO_RUN_INPUT_AUTOMATION_TESTS: "false"
        run: |
          set -o pipefail
          test_log="$RUNNER_TEMP/dialog-metadata-contracts.log"
          swift test --no-parallel \
            --filter 'DialogMetadataReaderTests|DialogMetadataContractTests|DialogHierarchyReaderTests|DialogHierarchyAttributeTests|DialogOperationDeadlineTests|ElementDetectionDetachedRunnerTests' \
            2>&1 | tee "$test_log"
          grep -Fq "Test Suite 'DialogMetadataReaderTests' passed" "$test_log"
          grep -Fq 'Suite DialogMetadataContractTests passed after ' "$test_log"
          grep -Fq 'Suite DialogOperationDeadlineTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run agent-surface contract tests
        working-directory: Core/PeekabooCore
        # These guard the tables that silently rot: the curated `learn` copy, the
        # MCP snapshot-effect classification, and the agent tool descriptions.
        # The full Core suite is too slow for CI, so name the guards explicitly.
        run: |
          swift test --no-parallel --filter ToolRegistryContractTests
          swift test --no-parallel --filter MCPToolSnapshotMutationTests
          swift test --no-parallel --filter AgentToolDescriptionTests

  peekaboo-cli:
    name: Peekaboo CLI build & tests
    runs-on: macos-26
    env:
      PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
      PEEKABOO_SKIP_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure checkout-local Swift workspace
        run: python3 scripts/setup-swift-workspace.py setup

      - name: Select Xcode 26.6 (if present) or fallback to default
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          /usr/bin/xcodebuild -version

      - name: Compute SwiftPM cache key (CLI)
        id: cache-key-cli
        env:
          CACHE_PREFIX: ${{ runner.os }}-spm-cli-dependencies-v2-
        run: |
          set -euo pipefail
          TOOLCHAIN_HASH=$({ swift --version && xcodebuild -version; } | shasum -a 256 | awk '{print $1}')
          SOURCE_HASH=$(git ls-files --stage -- Package.swift '**/Package.swift' '**/Package.resolved' \
            .gitmodules AXorcist Commander Swiftdansi Tachikoma TauTUI | shasum -a 256 | awk '{print $1}')
          echo "key=${CACHE_PREFIX}${TOOLCHAIN_HASH}-${SOURCE_HASH}" >> "$GITHUB_OUTPUT"
          echo "restore-prefix=${CACHE_PREFIX}${TOOLCHAIN_HASH}-" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM (CLI)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ steps.cache-key-cli.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key-cli.outputs.restore-prefix }}

      - name: Clean SwiftPM trait state (CLI)
        run: |
          set -euo pipefail
          # SwiftPM caches evaluated manifests in an sqlite DB. We've seen this get stale across
          # `swift-configuration` trait renames (e.g. `JSONSupport` -> `JSON`) and break resolution.
          for root in "$HOME/Library/Caches/org.swift.swiftpm" "$HOME/.cache/org.swift.swiftpm"; do
            if [ -d "$root" ]; then
              find "$root" -type f -name "manifest.db*" -print -delete || true
              find "$root" -type f -name "manifests.db*" -print -delete || true
              find "$root" -type f -name "package-collection.db*" -print -delete || true
            fi
          done
          # SwiftPM traits can be persisted into `.swiftpm/configuration/traits.json` (and can get stuck in caches).
          # When upstream packages rename/remove traits, stale state can break builds.
          find ~/.swiftpm -type f -name traits.json -print -delete || true
          if [ -d ~/.cache/org.swift.swiftpm ]; then
            find ~/.cache/org.swift.swiftpm -type d -name .swiftpm -prune -print -exec rm -rf {} + || true
          fi
          if [ -d Apps/CLI/.swiftpm ]; then
            find Apps/CLI/.swiftpm -type f -name traits.json -print -delete || true
          fi
          # Avoid caching any package-local state that might remember old trait selections.
          rm -rf Apps/CLI/.build || true

      - name: Show Swift toolchain version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build CLI target
        working-directory: Apps/CLI
        run: |
          swift build --configuration debug
          echo "PEEKABOO_CLI_BINARY=$(swift build --configuration debug --show-bin-path)/peekaboo" >> "$GITHUB_ENV"

      - name: Smoke test the built CLI and tool catalog
        run: |
          set -euo pipefail
          "$PEEKABOO_CLI_BINARY" --version
          "$PEEKABOO_CLI_BINARY" tools --json > "$RUNNER_TEMP/peekaboo-tools.json"
          python3 - "$RUNNER_TEMP/peekaboo-tools.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              result = json.load(source)
          assert result["success"] is True, result
          catalog = result["data"]
          assert catalog["count"] == len(catalog["tools"]) > 0, catalog
          print(f"Built CLI returned {catalog['count']} tools")
          PY

      - name: Smoke test structured MCP initialization over stdio
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          request = {
              "jsonrpc": "2.0", "id": 0, "method": "initialize",
              "params": {
                  "protocolVersion": "2025-06-18",
                  "capabilities": {"experimental": {"codex/auth-change": {}}},
                  "clientInfo": {"name": "synthetic-initialize-client", "version": "1.0"},
              },
          }
          result = subprocess.run(
              [os.environ["PEEKABOO_CLI_BINARY"], "mcp", "--no-remote"],
              input=json.dumps(request) + "\n", text=True, capture_output=True, timeout=30,
              env={**os.environ, "PEEKABOO_ALLOW_TOOLS": "permissions"}, check=True)
          response = json.loads(result.stdout)
          assert response["id"] == 0 and "error" not in response, response
          assert response["result"]["protocolVersion"] == "2025-06-18", response
          print("Built CLI accepted structured experimental capabilities over stdio")
          PY

      - name: Run CLI unit tests (skip automation)
        working-directory: Apps/CLI
        run: |
          swift test --no-parallel -Xswiftc -DPEEKABOO_SKIP_AUTOMATION

      - name: Run Agent JSON failure contracts (skip automation)
        working-directory: Apps/CLI
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/agent-json-failure-contracts.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel -Xswiftc -DPEEKABOO_SKIP_AUTOMATION \
            --filter '^CoreCLITests[.](AgentCommandStepLimitTests|AgentCommandJSONOutputTests)/' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite AgentCommandStepLimitTests passed after ' "$test_log"
          grep -Fq 'Suite AgentCommandJSONOutputTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run CLI paste admission timeout regression (skip automation)
        working-directory: Apps/CLI
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "true"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
          PEEKABOO_CONFIG_DISABLE_MIGRATION: "1"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/cli-paste-admission-timeout.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel -Xswiftc -DPEEKABOO_SKIP_AUTOMATION \
            --filter '^CLIAutomationTests\.PasteCommandTests/`Admission timeout preserves observations and a later clipboard paste recovers`\(binaryPayload:\)(/|$)' \
            2>&1 | tee "$test_log"
          grep -Eq 'Test "Admission timeout preserves observations and a later clipboard paste recovers"( with 2 test cases)? passed after ' "$test_log"
          grep -Fq 'Suite PasteCommandTests passed after ' "$test_log"
          grep -Eq 'Test run with 1 test( in 1 suite)? passed after ' "$test_log"

      - name: Run paste observation invalidation contracts (skip automation)
        working-directory: Apps/CLI
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "true"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
          PEEKABOO_CONFIG_DISABLE_MIGRATION: "1"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/paste-observation-invalidation.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel -Xswiftc -DPEEKABOO_SKIP_AUTOMATION \
            --filter '^CLIAutomationTests\.PasteObservationInvalidationTests/' \
            2>&1 | tee "$test_log"
          grep -Fq 'Suite PasteObservationInvalidationTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run taskless agent resume regression (skip automation)
        working-directory: Apps/CLI
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "true"
        run: |
          swift test --no-parallel -Xswiftc -DPEEKABOO_SKIP_AUTOMATION \
            --filter 'AgentCommandBasicTests|AgentCommandValidationIntegrationTests'

      - name: Run mocked interaction receipt regressions
        working-directory: Apps/CLI
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "true"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
          RUN_AUTOMATION_READ: "true"
          RUN_AUTOMATION_TESTS: "false"
          RUN_AUTOMATION_ACTIONS: "false"
          RUN_LOCAL_TESTS: "false"
        run: |
          set -o pipefail
          test_log="$RUNNER_TEMP/interaction-receipt-contracts.log"
          swift test --disable-xctest --enable-swift-testing --no-parallel \
            --filter '^CLIAutomationTests[.](PressCommandTests|ClickCommandTests|ClickCommandActionResultTests|ClickSnapshotWindowSelectionTests)/' 2>&1 | tee "$test_log"
          grep -Fq 'Suite PressCommandTests passed after ' "$test_log"
          grep -Fq 'Suite ClickCommandTests passed after ' "$test_log"
          grep -Fq 'Suite ClickCommandActionResultTests passed after ' "$test_log"
          grep -Fq 'Suite ClickSnapshotWindowSelectionTests passed after ' "$test_log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"

      - name: Run See configuration environment regressions
        working-directory: Apps/CLI
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "true"
          PEEKABOO_INCLUDE_AMBIENT_STATE_TESTS: "false"
          PEEKABOO_CONFIG_DISABLE_MIGRATION: "1"
        run: |
          python3 ../../scripts/test-see-config-environment.py

  tachikoma:
    name: Tachikoma build & tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Select Xcode 26.6 (if present) or fallback to default
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          /usr/bin/xcodebuild -version

      - name: Remove phantom submodule metadata
        run: |
          rm -f .gitmodules
          git config --local --remove-section submodule.Tachikoma || true

      - name: Compute SwiftPM cache key (Tachikoma)
        id: cache-key-tachikoma
        env:
          CACHE_PREFIX: ${{ runner.os }}-spm-tachikoma-
        run: |
          set -euo pipefail
          if [ -f Tachikoma/Package.resolved ]; then
            HASH=$(shasum Tachikoma/Package.resolved | awk '{print $1}')
          else
            echo "Package.resolved missing, falling back to commit SHA"
            HASH=${GITHUB_SHA}
          fi
          echo "key=${CACHE_PREFIX}${HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM (Tachikoma)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.swiftpm
            ~/.cache/org.swift.swiftpm
            Tachikoma/.build
          key: ${{ steps.cache-key-tachikoma.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-spm-tachikoma-

      - name: Clean SwiftPM trait state (Tachikoma)
        run: |
          set -euo pipefail
          # SwiftPM caches evaluated manifests in an sqlite DB. We've seen this get stale across
          # `swift-configuration` trait renames (e.g. `JSONSupport` -> `JSON`) and break resolution.
          for root in "$HOME/Library/Caches/org.swift.swiftpm" "$HOME/.cache/org.swift.swiftpm"; do
            if [ -d "$root" ]; then
              find "$root" -type f -name "manifest.db*" -print -delete || true
              find "$root" -type f -name "manifests.db*" -print -delete || true
              find "$root" -type f -name "package-collection.db*" -print -delete || true
            fi
          done
          # SwiftPM traits can be persisted into `.swiftpm/configuration/traits.json` (and can get stuck in caches).
          # When upstream packages rename/remove traits, stale state can break builds.
          find ~/.swiftpm -type f -name traits.json -print -delete || true
          if [ -d ~/.cache/org.swift.swiftpm ]; then
            find ~/.cache/org.swift.swiftpm -type d -name .swiftpm -prune -print -exec rm -rf {} + || true
          fi
          if [ -d Tachikoma/.swiftpm ]; then
            find Tachikoma/.swiftpm -type f -name traits.json -print -delete || true
          fi
          if [ -d Tachikoma/.build/checkouts ]; then
            find Tachikoma/.build/checkouts -type d -name .swiftpm -prune -print -exec rm -rf {} + || true
          fi

      - name: Show Swift toolchain version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Tachikoma
        working-directory: Tachikoma
        run: |
          swift build --configuration debug

      - name: Run Tachikoma package tests
        working-directory: Tachikoma
        env:
          TACHIKOMA_TEST_MODE: "mock"
          TACHIKOMA_DISABLE_API_TESTS: "true"
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/tachikoma-tests.log"
          swift test --no-parallel 2>&1 | tee "$test_log"
          # Inspect only completed output; an early-exiting pipe consumer can SIGPIPE Swift.
          if ! grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed after ' "$test_log"; then
            echo "::error::Tachikoma produced no positive Swift Testing test count. Check $test_log for zero tests or a missing summary."
            exit 1
          fi

  mac-apps:
    name: Build macOS apps (Peekaboo + Inspector)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure checkout-local Swift workspace
        run: python3 scripts/setup-swift-workspace.py setup

      - name: Select Xcode 26.6 (if present) or fallback to default
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          /usr/bin/xcodebuild -version

      - name: Run Mac package tests (secretless hosted runner only)
        working-directory: Apps/Mac
        env:
          PEEKABOO_CONFIG_DIR: ${{ runner.temp }}/peekaboo-mac-tests
          PEEKABOO_CONFIG_DISABLE_MIGRATION: "1"
          PEEKABOO_RUN_LIVE_AGENT_TESTS: "0"
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: "false"
        run: swift test --no-parallel

      - name: Build Peekaboo app (Xcode)
        working-directory: Apps
        run: |
          /usr/bin/env \
            -u DYLD_LIBRARY_PATH \
            -u DYLD_FRAMEWORK_PATH \
            -u DYLD_FALLBACK_FRAMEWORK_PATH \
            -u DYLD_ROOT_PATH \
            -u DYLD_INSERT_LIBRARIES \
            -u DYLD_IMAGE_SUFFIX \
            -u DYLD_VERSIONED_LIBRARY_PATH \
            -u DYLD_VERSIONED_FRAMEWORK_PATH \
            xcodebuild -workspace Peekaboo.xcworkspace \
            -scheme Peekaboo \
            -configuration Debug \
            -sdk macosx \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath /tmp/DerivedData-Peekaboo

      - name: Verify Peekaboo workspace package lock
        working-directory: Apps
        run: |
          set -euo pipefail
          test ! -e CLI/Package.resolved
          expected_revision="$(jq -er '.pins[] | select(.identity == "sparkle") | .state.revision' \
            Peekaboo.xcworkspace/xcshareddata/swiftpm/Package.resolved)"
          actual_revision="$(git -C /tmp/DerivedData-Peekaboo/SourcePackages/checkouts/Sparkle rev-parse HEAD)"
          test "$actual_revision" = "$expected_revision"

      - name: Build Inspector app (Xcode)
        working-directory: Apps
        run: |
          /usr/bin/env \
            -u DYLD_LIBRARY_PATH \
            -u DYLD_FRAMEWORK_PATH \
            -u DYLD_FALLBACK_FRAMEWORK_PATH \
            -u DYLD_ROOT_PATH \
            -u DYLD_INSERT_LIBRARIES \
            -u DYLD_IMAGE_SUFFIX \
            -u DYLD_VERSIONED_LIBRARY_PATH \
            -u DYLD_VERSIONED_FRAMEWORK_PATH \
            xcodebuild -workspace Peekaboo.xcworkspace \
            -scheme Inspector \
            -configuration Debug \
            -sdk macosx \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath /tmp/DerivedData-Peekaboo

  lint:
    name: SwiftLint (core + CLI)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint with CI config
        run: swiftlint --config .swiftlint-ci.yml

name: Supplemental release validation

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Expected 40-character SHA of the selected workflow revision
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release-validation.yml'
      - '.github/workflows/macos-ci.yml'
      - '.github/scripts/core-sigpipe-diagnostic.py'
      - 'tests/release-validation-workflow.test.mjs'

permissions:
  contents: read

jobs:
  full-suites:
    name: Full suites (${{ matrix.group }})
    runs-on: macos-26
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: core
            job_minutes: 120
            test_minutes: 90
            packages: Core/PeekabooCore
          - group: libraries-apps
            job_minutes: 140
            test_minutes: 130
            packages: |
              Core/PeekabooAutomationKit
              Core/PeekabooProtocols
              Core/PeekabooVisualizer
              Core/PeekabooUICore
              Apps/PeekabooInspector
              Apps/Playground
          - group: dependencies
            job_minutes: 100
            test_minutes: 90
            packages: |
              Tachikoma
              AXorcist
              Commander
              Swiftdansi
              TauTUI
          - group: full-safe
            job_minutes: 180
            test_minutes: 150
            packages: ''
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_PATHS: ${{ matrix.packages }}
      PEEKABOO_CONFIG_DISABLE_MIGRATION: '1'
      PEEKABOO_RUN_LIVE_AGENT_TESTS: '0'
    steps:
      - name: Validate exact source and hosted environment
        id: source
        env:
          SOURCE_EVENT: ${{ github.event_name }}
          TARGET_REF: ${{ inputs.target_ref }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$SOURCE_EVENT" in
            workflow_dispatch)
              [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'target_ref must be an exact 40-hex SHA' >&2; exit 1; }
              [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid workflow revision SHA' >&2; exit 1; }
              source_sha="$(printf '%s' "$WORKFLOW_COMMIT" | tr 'A-F' 'a-f')"
              expected_sha="$(printf '%s' "$TARGET_REF" | tr 'A-F' 'a-f')"
              [[ "$expected_sha" == "$source_sha" ]] || { echo 'target_ref must match the selected workflow revision' >&2; exit 1; }
              ;;
            pull_request)
              [[ "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid PR head SHA' >&2; exit 1; }
              source_sha="$(printf '%s' "$PR_HEAD_SHA" | tr 'A-F' 'a-f')"
              ;;
            *) echo 'Unsupported source event' >&2; exit 1 ;;
          esac
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]]
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'VALIDATION_RESULTS=%s/release-validation-results\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PEEKABOO_CONFIG_DIR=%s/peekaboo-release-validation\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out selected workflow revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Check out PR event head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout and pinned submodules
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$VALIDATION_RESULTS" "$PEEKABOO_CONFIG_DIR"
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          printf 'Source SHA: %s\nWorkflow: %s\nWorkflow SHA: %s\n' \
            "$actual_sha" "$WORKFLOW_REF" "$WORKFLOW_SHA" | tee "$VALIDATION_RESULTS/source.txt"
          git submodule status --recursive | tee "$VALIDATION_RESULTS/submodules.txt"
          if grep -Eq '^[^ ]' "$VALIDATION_RESULTS/submodules.txt"; then
            echo 'Submodules must match the checked-out gitlinks' >&2
            exit 1
          fi
          cp Apps/Peekaboo.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            "$VALIDATION_RESULTS/workspace-Package.resolved"

      - name: Configure checkout-local Swift workspace
        run: python3 scripts/setup-swift-workspace.py setup

      # Compatibility coverage only; the separately owned release proof uses Xcode 27.
      - name: Select installed Xcode 26.x and record actual toolchain
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              export DEVELOPER_DIR="${candidate}/Contents/Developer"
              break
            fi
          done
          {
            printf 'DEVELOPER_DIR=%s\n' "${DEVELOPER_DIR:?No installed Xcode found}"
            sw_vers
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
            command -v swift
            swift --version
          } | tee "$VALIDATION_RESULTS/toolchain.txt"
          # Validate the completed record without closing a live producer's output pipe.
          grep -Eq '^Xcode 26\.[0-9]+(\.[0-9]+)?$' "$VALIDATION_RESULTS/toolchain.txt"
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check workflow contract
        run: node --test tests/release-validation-workflow.test.mjs

      - name: Install safe-suite system tools
        if: matrix.group == 'full-safe'
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          result_dir="$VALIDATION_RESULTS/full-safe"
          mkdir -p "$result_dir"
          brew install ripgrep uv 2>&1 | tee "$result_dir/system-tools-install.log"
          rg --version | tee "$result_dir/ripgrep-version.txt"
          uv --version | tee "$result_dir/uv-version.txt"

      - name: Set up repository-pinned pnpm
        if: matrix.group == 'full-safe'
        timeout-minutes: 5
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false
          cache: false

      - name: Record safe-suite runtime and frozen dependency install
        if: matrix.group == 'full-safe'
        id: safe-install
        timeout-minutes: 10
        run: |
          set -euo pipefail
          result_dir="$VALIDATION_RESULTS/full-safe"
          mkdir -p "$result_dir"
          cp package.json pnpm-lock.yaml "$result_dir/"
          pnpm --version > "$result_dir/pnpm-version.txt"
          node --input-type=module <<'NODE' | tee "$result_dir/runtime.txt"
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const results = process.env.VALIDATION_RESULTS + '/full-safe';
          const actual = readFileSync(results + '/pnpm-version.txt', 'utf8').trim();
          console.log(`Node: ${process.version}\npnpm: ${actual}\npackageManager: ${pkg.packageManager}`);
          const pin = /^pnpm@(\d+\.\d+\.\d+)\+sha512\.[0-9a-f]+$/.exec(pkg.packageManager);
          assert.ok(pin, 'An exact repository pnpm pin with integrity is required');
          assert.equal(actual, pin[1], 'pnpm must match the repository pin');
          writeFileSync(results + '/test-safe-definition.txt', pkg.scripts['test:safe'] + '\n');
          NODE
          printf 'running\n' > "$result_dir/install-status.txt"
          install_exit=0
          pnpm install --frozen-lockfile 2>&1 | tee "$result_dir/install.log" || install_exit=$?
          printf '%s\n' "$install_exit" > "$result_dir/install-exit-code.txt"
          if [[ "$install_exit" == 0 ]]; then
            printf 'passed\n' > "$result_dir/install-status.txt"
          else
            printf 'failed\n' > "$result_dir/install-status.txt"
          fi
          exit "$install_exit"

      - name: Run full repository safe suite
        if: matrix.group == 'full-safe'
        id: safe
        timeout-minutes: ${{ matrix.test_minutes }}
        run: |
          set -euo pipefail
          result_dir="$VALIDATION_RESULTS/full-safe"
          mkdir -p "$result_dir"
          printf 'running\n' > "$result_dir/status.txt"
          printf 'pnpm run test:safe\n' > "$result_dir/command.txt"
          pipeline_status=(0 0)
          pnpm run test:safe 2>&1 | tee "$result_dir/test.log" || pipeline_status=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline_status[0]}" > "$result_dir/exit-code.txt"
          printf '%s\n' "${pipeline_status[1]}" > "$result_dir/log-exit-code.txt"
          # Preserve the complete command's exit, and fail separately if evidence could not be written.
          suite_exit="${pipeline_status[0]}"
          if [[ "$suite_exit" == 0 ]]; then suite_exit="${pipeline_status[1]}"; fi
          if [[ "$suite_exit" == 0 ]]; then
            printf 'passed\n' > "$result_dir/status.txt"
          else
            printf 'failed\n' > "$result_dir/status.txt"
          fi
          awk 'tolower($0) ~ /skip|fail|error:/ { print }' "$result_dir/test.log" > "$result_dir/failures-skips.txt"
          exit "$suite_exit"

      # Each matrix job has a fresh checkout and no restored package/build cache.
      # Standalone Playground resolution stays here, never in the app-packaging job.
      - name: Run complete package suites serially
        if: matrix.group != 'full-safe'
        id: suites
        timeout-minutes: ${{ matrix.test_minutes }}
        env:
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: 'false'
          RUN_AUTOMATION_TESTS: 'false'
          RUN_LOCAL_TESTS: 'false'
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            result_dir="$VALIDATION_RESULTS/${package//\//-}"
            mkdir -p "$result_dir"
            printf 'not-run\n' > "$result_dir/status.txt"
          done <<< "$PACKAGE_PATHS"

          failed=0
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            result_dir="$VALIDATION_RESULTS/${package//\//-}"
            printf 'running\n' > "$result_dir/status.txt"
            echo "::group::$package"
            if swift test --package-path "$package" --jobs 4 --no-parallel 2>&1 | tee "$result_dir/test.log"; then
              suite_exit=0
              printf 'passed\n' > "$result_dir/status.txt"
            else
              suite_exit=$?
              failed=1
              printf 'failed\n' > "$result_dir/status.txt"
            fi
            printf '%s\n' "$suite_exit" > "$result_dir/exit-code.txt"
            # Raw logs remain authoritative; this is an index, not a test-count parser.
            awk 'tolower($0) ~ /skip|fail|error:/ { print }' "$result_dir/test.log" > "$result_dir/failures-skips.txt"
            if [[ -f "$package/Package.resolved" ]]; then
              cp "$package/Package.resolved" "$result_dir/Package.resolved"
            fi
            echo '::endgroup::'
          done <<< "$PACKAGE_PATHS"
          exit "$failed"

      - name: Diagnose Core SIGPIPE without changing the failed result
        if: failure() && matrix.group == 'core' && steps.suites.outcome == 'failure'
        timeout-minutes: 10
        env:
          DIAGNOSTIC_GROUP: ${{ matrix.group }}
          ORIGINAL_SUITE_OUTCOME: ${{ steps.suites.outcome }}
          PEEKABOO_INCLUDE_AUTOMATION_TESTS: 'false'
          RUN_AUTOMATION_TESTS: 'false'
          RUN_LOCAL_TESTS: 'false'
        run: python3 .github/scripts/core-sigpipe-diagnostic.py

      - name: Summarize all packages and verify canonical workspace lock
        if: always() && steps.source.outcome == 'success' && matrix.group != 'full-safe'
        run: |
          set -euo pipefail
          mkdir -p "$VALIDATION_RESULTS"
          {
            printf '| Package | Suite status |\n| --- | --- |\n'
            while IFS= read -r package; do
              [[ -n "$package" ]] || continue
              result_dir="$VALIDATION_RESULTS/${package//\//-}"
              outcome=not-run
              if [[ -f "$result_dir/status.txt" ]]; then outcome="$(cat "$result_dir/status.txt")"; fi
              printf '| %s | %s |\n' "$package" "$outcome"
            done <<< "$PACKAGE_PATHS"
            printf '\nUnfiltered non-live suites; built-in permission/opt-in skips remain in each test.log and failures-skips.txt.\n'
            printf 'A running/not-run status is incomplete, never a pass. No app packaging or release-toolchain proof.\n'
          } | tee "$VALIDATION_RESULTS/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cmp "$VALIDATION_RESULTS/workspace-Package.resolved" \
            Apps/Peekaboo.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Summarize full safe suite and verify canonical workspace lock
        if: always() && steps.source.outcome == 'success' && matrix.group == 'full-safe'
        env:
          SAFE_STEP_OUTCOME: ${{ steps.safe.outcome }}
          INSTALL_STEP_OUTCOME: ${{ steps.safe-install.outcome }}
        run: |
          set -euo pipefail
          result_dir="$VALIDATION_RESULTS/full-safe"
          mkdir -p "$result_dir"
          outcome=not-run
          command_exit=unavailable
          if [[ -f "$result_dir/status.txt" ]]; then outcome="$(cat "$result_dir/status.txt")"; fi
          if [[ -f "$result_dir/exit-code.txt" ]]; then command_exit="$(cat "$result_dir/exit-code.txt")"; fi
          if [[ -f "$result_dir/test.log" ]]; then
            awk 'tolower($0) ~ /skip|fail|error:/ { print }' "$result_dir/test.log" > "$result_dir/failures-skips.txt"
          fi
          {
            printf 'Full pnpm run test:safe: %s; command exit: %s; step: %s; dependency install: %s.\n' \
              "$outcome" "$command_exit" "$SAFE_STEP_OUTCOME" "$INSTALL_STEP_OUTCOME"
            printf '\nThe unchanged command is a fail-fast chain. Later stages are not run after a failure.\n'
            printf 'The complete stage/test output is in full-safe/test.log; failures-skips.txt is only an index.\n'
            printf 'A running/not-run status or unavailable exit is incomplete, never a pass.\n'
            printf 'Built-in automation/provider skips and synthetic certification are not live proof.\n'
            printf 'Hosted compatibility evidence does not replace Xcode 27 preflight or signed isolated desktop proof.\n'
          } | tee "$VALIDATION_RESULTS/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cmp "$VALIDATION_RESULTS/workspace-Package.resolved" \
            Apps/Peekaboo.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Retain per-package evidence
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ matrix.group }}-${{ steps.source.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ env.VALIDATION_RESULTS }}
          if-no-files-found: error
          retention-days: 14

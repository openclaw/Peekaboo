name: Commander Multiplatform

on:
  push:
    paths:
      - 'Commander/**'
      - '.github/workflows/commander-multiplatform.yml'
  pull_request:
    paths:
      - 'Commander/**'
      - '.github/workflows/commander-multiplatform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-host:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Swift version
        working-directory: Commander
        run: swift --version
      - name: Test (macOS)
        working-directory: Commander
        run: swift test

  apple-simulators:
    runs-on: xcode-27
    needs: macos-host
    strategy:
      matrix:
        include:
          - platform: iOS
            sdk: iphonesimulator
            triple: arm64-apple-ios17.0-simulator
          - platform: tvOS
            sdk: appletvsimulator
            triple: arm64-apple-tvos17.0-simulator
          - platform: watchOS
            sdk: watchsimulator
            triple: arm64-apple-watchos10.0-simulator
    defaults:
      run:
        working-directory: Commander
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build for ${{ matrix.platform }}
        run: |
          set -euo pipefail
          SDK_PATH=$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)
          swift build \
            --build-tests \
            --triple "${{ matrix.triple }}" \
            --sdk "$SDK_PATH"

  linux:
    runs-on: ubuntu-24.04
    needs: macos-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: '6.3.3'
      - name: Test (Linux)
        working-directory: Commander
        run: swift test
